[workspace]
resolver = "2"
members = ["crates/adr"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/pantheon-org/pantheon-adr"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tempfile = "3"
# The shared Pantheon Agentic Harness Dev Kit crates. A git tag until they are published
# to crates.io; the tag is immutable, so bump it deliberately.
# The shared Pantheon Agentic Harness Dev Kit crates, pinned to a commit on the dev-kit's
# claude/practical-cori-8apzye branch until the dev-kit cuts a tag with `validate`. Both crates
# must use the same revision so the tools share one copy of pahdk-core.
pahdk-core = { git = "https://github.com/pantheon-org/pantheon-agentic-harness-dev-kit.git", rev = "cc21946fc6922ddea5be43aa1ceeeb698fd27ade", features = ["validate"] }
pahdk-install = { git = "https://github.com/pantheon-org/pantheon-agentic-harness-dev-kit.git", rev = "cc21946fc6922ddea5be43aa1ceeeb698fd27ade" }

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
