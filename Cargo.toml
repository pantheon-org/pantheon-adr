[workspace]
resolver = "2"
members = ["crates/adr"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/pantheon-org/pantheon-adr"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tempfile = "3"
# The shared Agentic Harness Dev Kit crates. A git tag until they are published
# to crates.io; the tag is immutable, so bump it deliberately.
ahdk-core = { git = "https://github.com/pantheon-org/agentic-harness-dev-kit.git", tag = "v0.1.0-rc.1" }
ahdk-install = { git = "https://github.com/pantheon-org/agentic-harness-dev-kit.git", tag = "v0.1.0-rc.1" }

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
